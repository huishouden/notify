# Huishouden notify: sends due reminders as Web Push notifications, for every household.
name = "huishouden-notify"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true

# The day's Firestore reads and the quota pause (src/reads.ts, pwa-kit `ReadBudget`). SQLite-backed:
# the only kind on the free plan.
[[durable_objects.bindings]]
name = "READ_LEDGER"
class_name = "ReadLedgerObject"

[[migrations]]
tag = "v1-read-ledger"
new_sqlite_classes = ["ReadLedgerObject"]

# Public values. Secrets are set with `bunx wrangler secret put`, never written here:
#   GOOGLE_SERVICE_ACCOUNT  service account key JSON (roles/datastore.user only)
#   VAPID_PRIVATE_KEY       from `bun run vapid`
#   NEW_RELIC_LICENSE_KEY   New Relic ingest key for the NotifyRun heartbeat (README, Monitoring)
[vars]
# The Firebase project the Huishouden apps use (public: it ships in every app's web config).
FIREBASE_PROJECT_ID = "huishouden-piekstra"
# From `bun run vapid`; the same key goes in each app repo's VITE_VAPID_PUBLIC_KEY variable.
VAPID_PUBLIC_KEY = "BORorVipYYfZaXFZA_XtfBu3CQLg-I3JuC_OC5avpprgqMdz3NYLJP6UdCt-5yjbgRgB8xPJPBSMTRuJl3sHIX0"
VAPID_SUBJECT = "https://github.com/huishouden/notify"
# Where a notification may lead: the suite's one site (every app under its own path), and the old
# per-app addresses, which redirect there. Anything else opens the app's home instead.
LINK_HOSTS = "huishouden-piekstra.web.app huishouden-*.web.app"
# New Relic account for the NotifyRun heartbeat (public; the ingest key is a secret).
NEW_RELIC_ACCOUNT_ID = "8578044"
# Firestore reads a day this Worker may use, the due-reminder queries included (576 a quiet day),
# of the free plan's 50,000 shared with every app and Worker (pwa-kit STANDARD.md "Read budgets";
# README, "Limits"). Spent: no reads until midnight Pacific. 1/288 of it per run is the share for
# household reads, past which households wait for a later run. Digits only: anything else makes
# every run throw.
FIRESTORE_NOTIFY_READS = "4000"

# Staging: the same Worker against huishouden-staging, for a PR's staging evidence (`hh dev evidence
# --staging`: deploy, then an HTTP check). No schedule and no secrets: it sends nothing. Runs are
# tested with the fakes (`bun test`); a staging run needs a staging service account's key
# (GOOGLE_SERVICE_ACCOUNT) and a VAPID pair of its own, set with `wrangler secret put --env staging`.
[env.staging]
name = "huishouden-notify-staging"
workers_dev = true

[env.staging.triggers]
crons = []

[[env.staging.durable_objects.bindings]]
name = "READ_LEDGER"
class_name = "ReadLedgerObject"

[[env.staging.migrations]]
tag = "v1-read-ledger"
new_sqlite_classes = ["ReadLedgerObject"]

[env.staging.vars]
FIREBASE_PROJECT_ID = "huishouden-staging"
VAPID_PUBLIC_KEY = ""
VAPID_SUBJECT = "https://github.com/huishouden/notify"
LINK_HOSTS = "huishouden-staging.web.app huishouden-staging-*.web.app"
FIRESTORE_NOTIFY_READS = "1000"
